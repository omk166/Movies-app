{% extends 'base.html' %}

{% block content %}
<h1>{% if form.instance.pk %}Edit Video{% else %}Add New Video{% endif %}</h1>
<form method="post" class="mt-3">
  {% csrf_token %}
  <div class="mb-3">
    {{ form.as_p }}
  </div>
  <button type="submit" class="btn btn-success">Save</button>
  <a href="{% url 'video_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
