{% extends 'base.html' %}

{% block content %}
<div class="alert alert-danger">
  <h4>Are you sure you want to delete "{{ video.MovieTitle }}"?</h4>
</div>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Yes, delete</button>
  <a href="{% url 'video_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
